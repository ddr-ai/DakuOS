name: Build DakuOS ISO

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'auto/**'
      - 'config/**'
      - '.github/workflows/build-iso.yml'

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 180

    # Use a real Debian image so we get a modern live-build
    container:
      image: debian:testing
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install live-build and dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            rsync \
            git \
            curl \
            wget \
            gnupg \
            ca-certificates \
            debian-archive-keyring

      - name: Make scripts executable
        run: |
          chmod +x auto/config
          find config/hooks -type f -name '*.hook.*' -exec chmod +x {} \; || true

      - name: Configure live-build
        run: |
          ./auto/config
          echo "=== Configuration dump ==="
          lb config --dump || true

      - name: Build the ISO
        run: |
          # live-build needs root privileges for chroot stages
          lb build 2>&1 | tee build.log

      - name: List build results
        if: always()
        run: |
          echo "=== Build directory contents ==="
          ls -lh
          echo
          echo "=== ISO files ==="
          ls -lh *.iso 2>/dev/null || echo "No ISO found"

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DakuOS-live-iso
          path: |
            *.iso
            build.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DakuOS-build-log-failed
          path: build.log
          retention-days: 7
          if-no-files-found: warn
