name: Build DakuOS ISO

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'auto/**'
      - 'config/**'
      - 'VERSION'
      - '.github/workflows/build-iso.yml'

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 180

    # Use a real Debian image so we get a modern live-build
    container:
      image: debian:testing
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install live-build and dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            rsync \
            git \
            curl \
            wget \
            gnupg \
            ca-certificates \
            debian-archive-keyring

      - name: Make scripts executable
        run: |
          chmod +x auto/config
          find config/hooks -type f -name '*.hook.*' -exec chmod +x {} \; || true

      - name: Read version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION}"

      - name: Configure live-build
        run: |
          ./auto/config
          echo "=== Configuration dump ==="
          lb config --dump || true

      - name: Build the ISO
        run: |
          # live-build needs root privileges for chroot stages
          lb build 2>&1 | tee build.log

      - name: Rename ISO to daku-<version>-amd64.iso
        if: success()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p daku_iso

          # live-build typically produces live-image-amd64.hybrid.iso
          SOURCE=$(ls -1 *.hybrid.iso *.iso 2>/dev/null | head -n1)

          if [ -z "$SOURCE" ]; then
            echo "ERROR: No ISO file found after build"
            ls -la
            exit 1
          fi

          TARGET="daku_iso/daku-${VERSION}-amd64.iso"
          echo "Renaming ${SOURCE} → ${TARGET}"
          mv "$SOURCE" "$TARGET"
          ls -lh daku_iso/

      - name: List build results
        if: always()
        run: |
          echo "=== Build directory contents ==="
          ls -lh
          echo
          echo "=== daku_iso/ ==="
          ls -lh daku_iso/ 2>/dev/null || echo "(empty or missing)"

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daku-${{ steps.version.outputs.version }}-amd64
          path: |
            daku_iso/daku-${{ steps.version.outputs.version }}-amd64.iso
            build.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DakuOS-build-log-failed
          path: build.log
          retention-days: 7
          if-no-files-found: warn
