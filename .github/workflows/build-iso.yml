name: Build DakuOS ISO

on:
  # Manual trigger (recommended while iterating)
  workflow_dispatch:

  # Optional: also build on pushes to main that change build config
  push:
    branches: [main]
    paths:
      - 'auto/**'
      - 'config/**'
      - '.github/workflows/build-iso.yml'

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 180          # live-build can take a long time

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install live-build and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            rsync \
            git \
            curl \
            wget \
            gnupg \
            ca-certificates

      - name: Make scripts executable
        run: |
          chmod +x auto/config
          find config/hooks -type f -name '*.hook.*' -exec chmod +x {} \;

      - name: Configure live-build
        run: |
          # Generate the full config tree from auto/config
          ./auto/config
          # Safety: show what was configured
          lb config --dump || true

      - name: Build the ISO
        run: |
          # live-build needs root for the chroot stages
          sudo lb build 2>&1 | tee build.log

      - name: List build results
        if: always()
        run: |
          echo "=== Build directory contents ==="
          ls -lh
          echo
          echo "=== ISO files ==="
          ls -lh *.iso 2>/dev/null || echo "No ISO found"

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DakuOS-live-iso
          path: |
            *.iso
            build.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DakuOS-build-log-failed
          path: build.log
          retention-days: 7
