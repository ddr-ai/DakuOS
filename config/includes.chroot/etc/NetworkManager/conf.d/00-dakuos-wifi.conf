# DakuOS Wi-Fi policy
#
# Client devices cannot force an access-point channel – the AP owns the channel.
# What we can do is steer the client toward the fastest available band and the
# strongest BSSID when multiple APs share an SSID.
#
# Preference order (when the network advertises them):
#   6 GHz (Wi-Fi 6E / Wi-Fi 7)  >  5 GHz  >  2.4 GHz
#
# Note: There is no standard consumer "7 GHz" Wi-Fi band. Wi-Fi 7 uses
# 2.4 / 5 / 6 GHz. "Least crowded channel" is chosen by the router; the
# client picks the best BSSID/band it can hear.

[device]
# Random MAC on scan only; keep stable address when associated (better roaming)
wifi.scan-rand-mac-address=yes

[connection]
# Prefer 5 GHz and above when the driver reports multiple bands for an SSID.
# NetworkManager 1.58+ also understands the literal value "6GHz" on connections.
wifi.cloned-mac-address=preserve

[main]
# Keep using wpa_supplicant (well tested with Intel AX/BE cards on Lunar Lake)
wifi.backend=wpa_supplicant
