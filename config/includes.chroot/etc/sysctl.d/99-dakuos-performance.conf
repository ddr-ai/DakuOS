# DakuOS performance defaults (safe on NVMe + Intel Core Ultra)

# Reduce swap tendency on systems with plenty of RAM (Lunar Lake typically 16–32 GB)
vm.swappiness = 10

# Allow more dirty pages in RAM before forcing writeback (better sequential write bursts)
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# Faster TCP connection reuse
net.ipv4.tcp_fastopen = 3

# Slightly more responsive scheduler for interactive desktops
kernel.sched_autogroup_enabled = 1
